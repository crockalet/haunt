name: Pages

# Publishes site/ (privacy policy for the Play listing) to https://crockalet.github.io/haunt/.
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The contact address stays out of the repo; it's filled in from the secret at deploy time.
      - name: Fill in contact e-mail
        env:
          HAUNT_CONTACT_EMAIL: ${{ secrets.HAUNT_CONTACT_EMAIL }}
        run: |
          test -n "$HAUNT_CONTACT_EMAIL"
          sed -i "s|__CONTACT_EMAIL__|$HAUNT_CONTACT_EMAIL|g" site/*.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
