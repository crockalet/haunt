name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-configuration-cache jvmTest :cli:test

      - name: Build CLI
        run: ./gradlew --no-configuration-cache :cli:installDist :cli:distZip

      - name: Build APKs
        run: ./gradlew --no-configuration-cache :androidApp:assembleFossDebug :androidApp:assemblePlayDebug

      - uses: actions/upload-artifact@v4
        with:
          name: haunt-debug
          path: |
            androidApp/build/outputs/apk/**/*.apk
            cli/build/distributions/*.zip
