<!-- @dsCard group="Foundations" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body{margin:0;padding:20px;background:#fff}
  .phones{display:flex;gap:20px;flex-wrap:wrap}
  .phone{position:relative;width:360px;height:640px;border-radius:32px;overflow:hidden}
  .map{position:absolute;inset:0;background:
    linear-gradient(28deg,transparent 46%,var(--hn-casing) 46%,var(--hn-casing) 48.5%,var(--hn-major-road) 48.5%,var(--hn-major-road) 51.5%,var(--hn-casing) 51.5%,var(--hn-casing) 54%,transparent 54%),
    linear-gradient(-62deg,transparent 30%,var(--hn-minor-road) 30%,var(--hn-minor-road) 31.5%,transparent 31.5%,transparent 70%,var(--hn-minor-road) 70%,var(--hn-minor-road) 71.5%,transparent 71.5%),
    radial-gradient(circle at 78% 22%,var(--hn-park) 0 18%,transparent 18.5%),
    radial-gradient(ellipse at 10% 80%,var(--hn-water) 0 22%,transparent 22.5%),
    var(--hn-map)}
  .pin{position:absolute;left:50%;top:44%;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--hn-accent);border:3px solid #fff;box-shadow:0 0 0 22px var(--hn-halo),0 2px 6px var(--hn-marker-shadow)}
  .top{position:absolute;top:16px;left:16px;right:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
  .bottom{position:absolute;left:16px;right:16px;bottom:20px;display:flex;flex-direction:column;gap:10px}
  .bar{display:flex;gap:10px;align-items:center;justify-content:center}
  svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="phones">
<div class="phone hn-app" data-theme="light"></div>
<div class="phone hn-app" data-theme="dark"></div>
</div>
<template id="t">
  <div class="map"></div><div class="pin"></div>
  <div class="top">
    <div class="hn-glass hn-search" style="align-self:stretch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="hn-body" style="flex:1">Search or paste coordinates</span>
      <button class="hn-icon-btn"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    </div>
    <div class="hn-glass hn-status"><span class="hn-dot"></span>Haunting <span class="hn-coords hn-muted">51.5073, -0.1278</span></div>
  </div>
  <div class="bottom">
    <div class="hn-glass hn-card">
      <div><div class="hn-title">Trafalgar Square</div><div class="hn-coords hn-muted">51.50735, -0.12776</div></div>
      <div class="hn-tiles">
        <div class="hn-tile"><span>Altitude</span><span>21 m</span></div>
        <div class="hn-tile"><span>Accuracy</span><span>5 m</span></div>
        <div class="hn-tile"><span>Rate</span><span>1 Hz</span></div>
      </div>
    </div>
    <div class="bar">
      <div class="hn-glass hn-toolbar">
        <button class="hn-icon-btn hn-tool" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></button>
        <button class="hn-icon-btn hn-tool"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"/></svg></button>
        <button class="hn-icon-btn hn-tool"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
        <span style="width:1px;height:26px;background:var(--hn-divider)"></span><button class="hn-icon-btn hn-tool"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      </div>
      <button class="hn-stop"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;stroke:none"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
    </div>
  </div>
</template>
<script>for(const p of document.querySelectorAll('.phone'))p.innerHTML=document.getElementById('t').innerHTML</script>
</body></html>
